repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: web-server           # Name of the Helm release
    namespace: default         # Target Kubernetes namespace
    chart: bitnami/nginx       # The chart to install (repo/chart)
    version: 23.0.2            # Optional: Lock the version for stability
    
    # Configuration overrides
    values:
      - service:
          type: ClusterIP
      - replicaCount: 2
